<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact — Shan Benson Studio</title>
  <meta name="description" content="Get in touch with Shan Benson Studio.">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header">
    <div class="container">
      <a href="index.html" class="logo">Shan Benson Studio</a>
      <button class="nav-toggle" aria-label="Toggle navigation">&#9776;</button>
      <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="services.html">Services</a></li>
        <li><a href="contact.html" aria-current="page">Contact</a></li>
      </ul>
    </div>
  </header>

  <main>
    <section class="hero">
      <div class="container">
        <h1>Let's talk</h1>
        <p>Tell us a bit about your project and we'll get back to you shortly.</p>
      </div>
    </section>

    <section>
      <div class="container">
        <form class="contact-form" action="mailto:hello@shanbensonstudio.com" method="post" enctype="text/plain">
          <div>
            <label for="name">Name</label>
            <input type="text" id="name" name="name" required>
          </div>
          <div>
            <label for="email">Email</label>
            <input type="email" id="email" name="email" required>
          </div>
          <div>
            <label for="message">Message</label>
            <textarea id="message" name="message" required></textarea>
          </div>
          <button type="submit" class="btn btn-primary">Send message</button>
        </form>

        <p class="contact-info">Prefer email? Reach us directly at <a href="mailto:hello@shanbensonstudio.com">hello@shanbensonstudio.com</a>.</p>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <span>&copy; <span id="year"></span> Shan Benson Studio</span>
      <span><a href="contact.html">Contact</a></span>
    </div>
  </footer>

  <script src="js/main.js"></script>
  <script>document.getElementById("year").textContent = new Date().getFullYear();</script>
</body>
</html>
