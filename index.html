<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shan Mond — Photographer &amp; Director</title>
  <meta name="description" content="Shan Mond is a photographer and director working across editorial, fashion and film.">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="home is-loading">
  <header class="site-header">
    <div class="container">
      <a href="index.html" class="logo">Shan Mond</a>
      <button class="nav-toggle" aria-label="Toggle navigation">&#9776;</button>
      <ul class="nav-links">
        <li><a href="index.html" aria-current="page">Index</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="services.html">Work</a></li>
        <li><a href="contact.html">Contact</a></li>
      </ul>
    </div>
  </header>

  <main>
    <section class="home-hero" aria-label="Selected work">
      <span class="plus-mark" aria-hidden="true">+</span>
      <h1 class="brand-flash">Shan Mond</h1>

      <div class="scatter-item" style="--top:-2vh; --left:-4vw; --w:14vw; --rot:-2deg; --d:0.02s;">
        <img src="images/portrait-01.svg" alt="Backlit portrait study — placeholder, replace with your work" loading="eager">
      </div>
      <div class="scatter-item" style="--top:11vh; --left:15vw; --w:21vw; --rot:-1deg; --d:0.08s;">
        <img src="images/landscape-01.svg" alt="Landscape study — placeholder, replace with your work" loading="eager">
      </div>
      <div class="scatter-item scatter-item--feature" style="--top:5vh; --left:62vw; --w:20vw; --rot:1deg; --d:0.05s;">
        <img src="images/editorial-01.svg" alt="Editorial portrait — placeholder, replace with your work" loading="eager">
      </div>
      <div class="scatter-item" style="--top:-3vh; --left:92vw; --w:12vw; --rot:-1deg; --d:0.14s;">
        <img src="images/desert-01.svg" alt="Desert location study — placeholder, replace with your work" loading="lazy">
      </div>
      <div class="scatter-item" style="--top:46vh; --left:-3vw; --w:15vw; --rot:-2deg; --d:0.1s;">
        <img src="images/portrait-02.svg" alt="Two-subject portrait — placeholder, replace with your work" loading="lazy">
      </div>
      <div class="scatter-item" style="--top:36vh; --left:87vw; --w:13vw; --rot:2deg; --d:0.18s;">
        <img src="images/mono-01.svg" alt="Monochrome close portrait — placeholder, replace with your work" loading="lazy">
      </div>
      <div class="scatter-item" style="--top:66vh; --left:16vw; --w:19vw; --rot:-1deg; --d:0.12s;">
        <img src="images/interior-01.svg" alt="Group portrait, interior light — placeholder, replace with your work" loading="lazy">
      </div>
      <div class="scatter-item" style="--top:58vh; --left:63vw; --w:18vw; --rot:1deg; --d:0.16s;">
        <img src="images/field-01.svg" alt="Monochrome field study — placeholder, replace with your work" loading="lazy">
      </div>
      <div class="scatter-item" style="--top:79vh; --left:39vw; --w:15vw; --rot:-2deg; --d:0.2s;">
        <img src="images/motion-01.svg" alt="Figure in motion — placeholder, replace with your work" loading="lazy">
      </div>
      <div class="scatter-item" style="--top:90vh; --left:-4vw; --w:13vw; --rot:1deg; --d:0.06s;">
        <img src="images/still-01.svg" alt="Still life — placeholder, replace with your work" loading="lazy">
      </div>
      <div class="scatter-item" style="--top:90vh; --left:90vw; --w:13vw; --rot:-1deg; --d:0.22s;">
        <img src="images/portrait-03.svg" alt="Close portrait — placeholder, replace with your work" loading="lazy">
      </div>
    </section>

    <section class="statement">
      <div class="container">
        <p class="section-lead">Shan Mond is a photographer and director working across editorial, fashion and film — building images around light, movement and stillness in equal measure.</p>
        <a href="services.html" class="btn btn-primary">See selected work</a>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <span>&copy; <span id="year"></span> Shan Mond</span>
      <span><a href="contact.html">Contact</a></span>
    </div>
  </footer>

  <script src="js/main.js"></script>
  <script>document.getElementById("year").textContent = new Date().getFullYear();</script>
</body>
</html>
